limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
server {
    listen 80;
    client_max_body_size 12m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_login login:3000;
    set $backend_proveedores proveedores:5000;
    set $backend_resenas resenas:3000;
    set $backend_historial historial-compras:5000;
    set $backend_core libreria-core:8080;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 60s;

    location = /health { default_type text/plain; return 200 'gateway ok'; }
    location ^~ /api/v1/ { proxy_pass http://$backend_login; }
    location ^~ /api/proveedores { proxy_pass http://$backend_proveedores; }
    location ^~ /api/resenas { proxy_pass http://$backend_resenas; }
    location ^~ /api/historial-compras { proxy_pass http://$backend_historial; }
    location ^~ /api/cuenta/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://$backend_core;
    }
    location ^~ /api/ { proxy_pass http://$backend_core; }
    location ^~ /internal/ { return 404; }
    # Scalar y OpenAPI de ASP.NET Core a través de la misma Gateway.
    location ^~ /scalar/ { proxy_pass http://$backend_core; }
    location ^~ /openapi/ { proxy_pass http://$backend_core; }
    location / { return 404 'Ruta no encontrada'; }
}
